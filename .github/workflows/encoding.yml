name: Encoding hygiene

on:
  push:
  pull_request:

jobs:
  validate-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tracked text encoding and mojibake
        run: node scripts/fix-encoding.mjs --check
